# =============================================================================
# DevsFleet POS — nginx site
#
#   sudo cp devsfleet-pos.conf /etc/nginx/sites-available/devsfleet-pos
#   sudo ln -sf /etc/nginx/sites-available/devsfleet-pos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Three hostnames, all terminating here and proxying to loopback:
#
#   pos.devsfleet.com  -> 127.0.0.1:3000   admin panel   (PM2)
#   api.devsfleet.com  -> 127.0.0.1:3001   API           (PM2)
#   cdn.devsfleet.com  -> 127.0.0.1:9000   MinIO         (docker)
#
# Nothing here touches the existing isp.devsfleet.com or devsfleet.com blocks.
#
# Certificates come from certbot; obtain them with the bootstrap config in this
# directory before loading this file, or nginx will refuse to start.
# =============================================================================

# -----------------------------------------------------------------------------
# Rate limit for the WhatsApp webhook.
#
# The endpoint is unauthenticated by necessity — Meta sends no bearer token —
# so the HMAC is the only real gate. This zone keeps a flood of forged payloads
# from reaching Node at all; each one that does costs an HMAC and a database
# lookup. The API throttles too (600/min); this is the cheaper outer layer.
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=devsfleet_webhook:10m rate=30r/s;

# HTTP -> HTTPS, with the ACME path left open for renewals.
server {
    listen 80;
    listen [::]:80;
    server_name pos.devsfleet.com api.devsfleet.com cdn.devsfleet.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# API — https://api.devsfleet.com
#
# Also what the POS terminals sync against and where Meta delivers webhooks.
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.devsfleet.com;

    ssl_certificate     /etc/letsencrypt/live/pos.devsfleet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.devsfleet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # Product image uploads and a POS terminal syncing a day's offline sales.
    client_max_body_size 25m;

    access_log /var/log/nginx/devsfleet-api-access.log;
    error_log  /var/log/nginx/devsfleet-api-error.log;

    # Shared proxy settings. The API sets `trust proxy 1`, so it reads the
    # client address from X-Forwarded-For and the scheme from X-Forwarded-Proto
    # — without the latter every redirect and every cookie it issues would say
    # http, and the browser would drop them.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # -------------------------------------------------------------------------
    # Notification WebSocket.
    #
    # socket.io serves from /socket.io/ regardless of the gateway's namespace
    # ("/notifications" is a socket.io namespace, multiplexed over this one
    # path — it is NOT a URL). Proxying only /notifications would therefore
    # match nothing, and the panel would silently fall back to long-polling.
    #
    # The long read timeout is the point: an idle WebSocket sends nothing, and
    # the default 60s would cut every connection once a minute.
    # -------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # WhatsApp webhook.
    #
    # proxy_request_buffering stays ON (the default) deliberately: the API
    # verifies X-Hub-Signature-256 over the exact bytes Meta sent, and it reads
    # them from req.rawBody. Anything that re-encodes or streams the body
    # differently breaks every signature and silently drops every message.
    # Nothing in this block modifies the body — do not add anything that does.
    # -------------------------------------------------------------------------
    # The path Meta is configured with. `api/v1` is the API's global prefix
    # (API_PREFIX); only /health and /ready are excluded from it, so the
    # webhook does NOT live at the root. A location of /whatsapp/webhook would
    # match nothing, fall through to `location /`, and quietly lose the rate
    # limit below — the endpoint would still work, which is what makes the
    # mistake hard to notice.
    location /api/v1/whatsapp/webhook {
        limit_req zone=devsfleet_webhook burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 60s;
    }

    # Health probes — a POS terminal polls these every few seconds and would
    # otherwise bury every real request in the access log.
    location = /health { proxy_pass http://127.0.0.1:3001; access_log off; }
    location = /ready  { proxy_pass http://127.0.0.1:3001; access_log off; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        # A terminal that has been offline for a day pushes a large batch; the
        # default 60s cuts it off mid-sync and the outbox retries forever.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# =============================================================================
# Admin panel — https://pos.devsfleet.com
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pos.devsfleet.com;

    ssl_certificate     /etc/letsencrypt/live/pos.devsfleet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.devsfleet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No CSP or X-Frame-Options here: Next.js sets its own in next.config.ts,
    # and a duplicate Content-Security-Policy header is intersected by the
    # browser, so adding a second one here can only break the panel.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    client_max_body_size 25m;

    access_log /var/log/nginx/devsfleet-admin-access.log;
    error_log  /var/log/nginx/devsfleet-admin-error.log;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next fingerprints these filenames, so they are immutable by construction.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # POS terminal installers + the electron-updater feed — see
    # .github/workflows/pos-release.yml. Served directly by nginx: a till
    # polling for updates, or downloading a multi-hundred-MB installer, has no
    # reason to go through the admin panel's Node process, and this directory
    # holds no per-tenant data for the admin app's auth to apply to.
    #
    # Deliberately NOT at /releases/ — that path is the admin panel's own
    # page (apps/admin/src/app/releases/page.tsx), which fetches latest.yml
    # from here client-side to render download buttons. Both living under
    # /releases would mean whichever nginx or Next.js matched first shadowed
    # the other.
    #
    # no-cache, not immutable: latest.yml/latest-linux.yml are overwritten on
    # every release and must be revalidated on every poll, or a till (or the
    # releases page) stuck behind a caching proxy would never see a new
    # version exists.
    location /pos-dl/ {
        alias /var/www/devsfleet-pos-releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}

# =============================================================================
# Product images — https://cdn.devsfleet.com
#
# THIS BLOCK IS A WHITELIST, AND THAT IS THE WHOLE POINT.
#
# The API writes two kinds of object into one bucket:
#
#   <tenantId>/products/<productId>/<checksum>.<ext>   images
#   <tenantId>/quotations/QUO-2026-0001.pdf            customer documents
#
# Quotation numbers are SEQUENTIAL, so a rule that proxied the bucket wholesale
# would let anyone who learned a single tenant id enumerate every quotation the
# business has ever issued, with customer names and line prices in each. The
# regex below admits the products prefix and nothing else; MinIO's own
# anonymous policy (see docker-compose.data.yml) enforces the same limit a
# second time, for anything that reaches it without passing through here.
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.devsfleet.com;

    ssl_certificate     /etc/letsencrypt/live/pos.devsfleet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.devsfleet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    access_log /var/log/nginx/devsfleet-cdn-access.log;
    error_log  /var/log/nginx/devsfleet-cdn-error.log;

    # S3_PUBLIC_URL is https://cdn.devsfleet.com/devsfleet, so the bucket name
    # is the first path segment and the tenant uuid is the second.
    location ~ "^/devsfleet/[0-9a-fA-F-]{36}/products/" {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        return 404;
    }
}
