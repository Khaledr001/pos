# =============================================================================
# DevsFleet — tenant online stores on *.devsfleet.com
#
#   sudo cp devsfleet-storefronts.conf /etc/nginx/sites-available/devsfleet-storefronts
#   sudo ln -sf /etc/nginx/sites-available/devsfleet-storefronts /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Every tenant's shop — allahiq.devsfleet.com, the next one, and the one after —
# is served by ONE storefront process (PM2: devsfleet-pos-storefront, port
# 3002), which asks the API which tenant owns the hostname it was reached on.
# Adding a shop is a row in storefront_domains (Admin → Online Store); nothing
# in this file changes per tenant.
#
# A separate file from devsfleet-pos.conf on purpose: that one has been edited
# by hand on the server, and installing this must not overwrite it.
#
# nginx always prefers an exact server_name over a wildcard, so pos.,
# pos-api., cdn. and the other platform hosts keep their own blocks; only
# names nothing else claims land here. The API refuses those platform labels
# as shop addresses too (RESERVED_SUBDOMAINS), so the two cannot disagree.
#
# Certificate: one wildcard for the whole domain, issued by DNS challenge
# (an HTTP challenge cannot prove a wildcard). See docs/STOREFRONT.md,
# "Subdomain storefronts on the VPS":
#
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
#     -d devsfleet.com -d '*.devsfleet.com' --cert-name devsfleet.com
#
# A tenant's OWN domain (shop.allahiq.ae) is not covered by this file — see
# the same doc for how to add custom domains later.
# =============================================================================

# HTTP -> HTTPS, with the ACME path left open.
server {
    listen 80;
    listen [::]:80;
    server_name *.devsfleet.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.devsfleet.com;

    ssl_certificate     /etc/letsencrypt/live/devsfleet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devsfleet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Next sets its own security headers; a duplicate CSP would be intersected
    # by the browser and could only break the shop.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Shoppers upload nothing large; trade-application documents are the most.
    client_max_body_size 10m;

    access_log /var/log/nginx/devsfleet-storefronts-access.log;
    error_log  /var/log/nginx/devsfleet-storefronts-error.log;

    proxy_http_version 1.1;
    # The hostname IS the tenant. Host must reach the storefront untouched, and
    # X-Forwarded-Host is what its /api/v1 rewrite forwards on to the API.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Fingerprinted by Next, so safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # An add_header here replaces the server's, not adds to it — repeat HSTS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Everything else, /api/v1/* included: the storefront proxies the shopper's
    # API calls itself (next.config rewrite + proxy.ts), adding the shopper's IP
    # and the proxy secret so the API rate-limits shoppers, not the shop.
    # Sending /api/v1 straight to the API would skip that and lose the cookies'
    # first-party domain.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
