# =============================================================================
# BOOTSTRAP ONLY — used once, to obtain the first certificates.
#
#   sudo cp devsfleet-pos.bootstrap.conf /etc/nginx/sites-available/devsfleet-pos
#   sudo ln -sf /etc/nginx/sites-available/devsfleet-pos /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d pos.devsfleet.com -d api.devsfleet.com -d cdn.devsfleet.com
#
# Then replace this file with devsfleet-pos.conf and reload again.
#
# It exists because the real config references certificate files, and nginx
# refuses to start when an ssl_certificate path does not exist — so the certs
# have to be obtained before that config can ever load. This is the chicken
# and the egg, resolved.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pos.devsfleet.com api.devsfleet.com cdn.devsfleet.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404 "not configured yet\n";
    }
}
