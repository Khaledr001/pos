name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: "24.11.1"
  PNPM_VERSION: "11.2.2"

jobs:
  # ---------------------------------------------------------------------------
  # Which services were actually touched.
  #
  # A change to apps/admin must not rebuild or redeploy the API. Shared packages
  # are the exception — they compile into every service, so touching one means
  # all of them are affected.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
      pos: ${{ steps.filter.outputs.pos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            api:
              - *shared
              - 'apps/api/**'
            admin:
              - *shared
              - 'apps/admin/**'
            pos:
              - *shared
              - 'apps/pos/**'

  # ---------------------------------------------------------------------------
  # Repo-wide checks. Cheap, and they gate everything else.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # First, because it is the rule that keeps services independently
      # deployable and it fails in under a second.
      - name: Service boundaries
        run: pnpm check:boundaries

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm format:check

  # ---------------------------------------------------------------------------
  # Migrations and RLS against a real PostgreSQL.
  #
  # Tenant isolation cannot be unit-tested — it is enforced by the database, so
  # it has to be proved against one. This job is why a missing RLS policy is
  # caught here rather than in production.
  # ---------------------------------------------------------------------------
  database:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devsfleet_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          POSTGRES_DB: devsfleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devsfleet_migrator -d devsfleet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://devsfleet_migrator:ci_migrator_password@localhost:5432/devsfleet
      DATABASE_URL: postgres://devsfleet_app:ci_app_password@localhost:5432/devsfleet
      APP_DB_PASSWORD: ci_app_password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The GitHub `services:` block does not run docker-entrypoint-initdb.d,
      # so the role and extensions have to be created explicitly here.
      - name: Bootstrap roles and extensions
        run: |
          export PGPASSWORD=ci_migrator_password
          psql -h localhost -U devsfleet_migrator -d devsfleet \
            -c "CREATE ROLE devsfleet_app LOGIN PASSWORD 'ci_app_password' NOBYPASSRLS"
          psql -h localhost -U devsfleet_migrator -d devsfleet \
            -v ON_ERROR_STOP=1 -f docker/postgres/init/01-extensions-and-grants.sql

      - name: Migrate (fails if any tenant table lacks RLS)
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: Prove tenant isolation
        run: node scripts/verify-rls.mjs

  # ---------------------------------------------------------------------------
  # CD — Automatic deployment to VPS (163.227.50.195).
  #
  # Deploys when changes are pushed to main or master (or dispatched manually),
  # after verify and database migration/RLS checks succeed.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [changes, verify, database]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.verify.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || '163.227.50.195' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE || '' }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ vars.DEPLOY_PATH || '/var/www/devsfleet-pos' }}
            ./deploy/deploy.sh


