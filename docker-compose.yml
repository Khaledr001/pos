name: devsfleet

services:
  postgres:
    image: postgres:18-alpine
    container_name: devsfleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsfleet_migrator
      POSTGRES_PASSWORD: migrator_dev_password
      POSTGRES_DB: devsfleet
      # Deterministic collation so ORDER BY on product names never shifts
      # between machines or a Postgres minor upgrade.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsfleet_migrator -d devsfleet"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

  redis:
    image: redis:8-alpine
    container_name: devsfleet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: devsfleet-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: devsfleet
      MINIO_ROOT_PASSWORD: devsfleet_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: devsfleet-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 devsfleet devsfleet_dev_password &&
      mc mb --ignore-existing local/devsfleet &&
      mc anonymous set download local/devsfleet/public &&
      echo 'MinIO bucket ready'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
