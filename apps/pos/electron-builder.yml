appId: com.devsfleet.pos
productName: DevsFleet POS
executableName: devsfleet-pos
artifactName: "devsfleet-pos-${version}-${arch}.${ext}"
copyright: Copyright © DevsFleet

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json

# better-sqlite3 is a native binding: it must be unpacked from the asar
# archive, because Node cannot dlopen a .node file that lives inside one.
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"

win:
  icon: "public/icon/DevsFleet-Fav.png"
  artifactName: "devsfleet-pos-setup-${version}.${ext}"
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DevsFleet POS

linux:
  icon: "public/icon/DevsFleet-Fav.png"
  executableName: devsfleet-pos
  maintainer: "DevsFleet <support@devsfleet.com>"
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office

deb:
  packageName: devsfleet-pos

mac:
  icon: "public/icon/DevsFleet-Fav.png"
  artifactName: "devsfleet-pos-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business

# Terminals sit behind a shop's router with no one watching them. Auto-update
# from the self-hosted VPS keeps them current without a site visit.
#
# /pos-dl, not /releases: the latter is the admin panel's own page
# (apps/admin/src/app/releases/page.tsx) — see the nginx config's comment on
# the /pos-dl/ location for why they can't share a path.
publish:
  provider: generic
  url: https://pos.devsfleet.com/pos-dl
