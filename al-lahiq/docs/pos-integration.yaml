openapi: 3.1.0
info:
  title: Al-Lahiq POS ↔ Website integration
  version: 1.0.0
  description: |
    Contract between the shop's POS and the online store. Build the POS side
    against this document; the website side is implemented in
    `backend/src/modules/pos-sync`.

    ## Who owns what
    - **POS is the master** for SKUs, prices (price lists), stock and VAT class.
    - **Website is the master** for product content (descriptions, images, SEO)
      and for online orders.
    - Records are matched on **SKU**; branches on **branch code**; price lists
      on **price list code**; trade customers on **email** or **POS customer code**.

    ## Directions
    1. **POS → Website**: the POS POSTs signed events to
       `POST {WEBSITE}/api/v1/pos/webhooks` whenever something changes.
    2. **Website → POS**: the website POSTs signed events to
       `POST {POS_BASE_URL}/website/events` (orders, status changes, refunds,
       trade applications). The POS must implement this endpoint.
    3. **Nightly reconciliation**: at 02:00 Dubai time the website calls
       `GET {POS_BASE_URL}/website/snapshot` and corrects any drift. The POS
       must implement this endpoint.

    ## Signatures (both directions)
    Every request carries:
    - `X-AL-Timestamp`: unix time in seconds
    - `X-AL-Signature`: `sha256=` + hex(HMAC-SHA256(secret, "{timestamp}.{raw body}"))

    POS → Website uses `POS_WEBHOOK_SECRET`; Website → POS uses
    `POS_OUTBOUND_SECRET` (for the snapshot GET the body is the empty string).
    Requests older than 5 minutes are rejected. Compare signatures in
    constant time.

    Example (Node.js):
    ```js
    const ts = Math.floor(Date.now() / 1000);
    const body = JSON.stringify(event);
    const sig = 'sha256=' + crypto.createHmac('sha256', secret).update(`${ts}.${body}`).digest('hex');
    ```

    ## Idempotency and ordering
    - Every event has a unique `eventId`. Receivers must ignore an `eventId`
      they have already processed and still answer 2xx. The website answers
      `202 {"status":"duplicate"}` for repeats.
    - Every POS change carries a `version` that only ever increases (e.g. a
      row version or a unix-millisecond timestamp). The website ignores an
      update whose version is not newer than what it has, so events can arrive
      out of order or be retried safely.
    - For price lists, one `version` covers the list and all of its rows:
      bump it on any change to the list or its items.

    ## Retries
    - The website retries failed deliveries to the POS with exponential backoff
      (30 s, 1 m, 2 m … up to 1 h) for 10 attempts, then parks the event as
      "dead" in the admin sync monitor, where staff can retry it.
    - The POS should retry webhook deliveries to the website on network errors
      and 5xx responses. A 4xx (other than 429) means the payload is wrong and
      should not be retried unchanged.

    ## Money and quantities
    - Money is **integer fils** (1 AED = 100 fils), **VAT-exclusive**.
    - Quantities are in the SKU's base unit of measure (`baseUom`) unless a
      `uom` is given. Quantities may be fractional (e.g. 2.5 m of cable).
    - Units of measure are short codes: `pc`, `m`, `roll`, `box`, `bag`,
      `sqm`, `can`, `pail`, `sheet`, `l`, `kg`.

    ## Prices on orders
    `order.created` lines carry the net unit price the customer paid, plus the
    price list and version it came from. **The POS must record the sale at
    these prices and must not re-price the order.** Discount codes arrive as a
    separate `discount` object.
servers:
  - url: https://www.example.ae
    description: Website (POS → Website webhooks)
  - url: https://pos.example.ae
    description: POS (Website → POS endpoints, set as POS_BASE_URL)

security:
  - hmacSignature: []
    hmacTimestamp: []

paths:
  /api/v1/pos/webhooks:
    post:
      summary: POS → Website event
      description: Implemented by the website. Send one event per request.
      operationId: receivePosEvent
      servers:
        - url: https://www.example.ae
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ProductUpsertEvent'
                - $ref: '#/components/schemas/StockUpdatedEvent'
                - $ref: '#/components/schemas/PriceListUpsertedEvent'
                - $ref: '#/components/schemas/PriceItemsChangedEvent'
                - $ref: '#/components/schemas/CustomerPriceListAssignedEvent'
                - $ref: '#/components/schemas/PosOrderStatusChangedEvent'
              discriminator:
                propertyName: type
            examples:
              stock:
                value:
                  eventId: pos-evt-000123
                  type: stock.updated
                  occurredAt: '2026-10-01T08:15:00+04:00'
                  data:
                    items:
                      - { sku: DC-1C-2.5-RD, branchCode: MAIN, quantity: 3400, version: 1790841300123 }
      responses:
        '202':
          description: Stored and queued (or a duplicate, ignored).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [accepted, duplicate] }
                  eventId: { type: string }
        '400':
          description: Envelope is invalid. Do not retry unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing, invalid or expired signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /website/events:
    post:
      summary: Website → POS event
      description: |
        **Implemented by the POS.** Respond 2xx once the event is stored.
        Deduplicate on `eventId` (also sent as the `X-AL-Event-Id` header).
      operationId: receiveWebsiteEvent
      servers:
        - url: https://pos.example.ae
      parameters:
        - in: header
          name: X-AL-Event-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OrderCreatedEvent'
                - $ref: '#/components/schemas/OrderStatusChangedEvent'
                - $ref: '#/components/schemas/OrderCancelledEvent'
                - $ref: '#/components/schemas/RefundCreatedEvent'
                - $ref: '#/components/schemas/TradeRequestedEvent'
              discriminator:
                propertyName: type
      responses:
        '200': { description: Stored. }
        '202': { description: Stored. }
        '4XX': { description: Rejected; the website retries, then parks it as dead. }
        '5XX': { description: Temporary failure; the website retries with backoff. }

  /website/snapshot:
    get:
      summary: Full snapshot for nightly reconciliation
      description: |
        **Implemented by the POS.** Returns every active and inactive SKU, stock
        per branch, and every price list with all of its rows. The website
        applies it as the source of truth: rows missing from a price list are
        deleted, stock is overwritten where the version is equal or newer.
      operationId: getSnapshot
      servers:
        - url: https://pos.example.ae
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }

components:
  securitySchemes:
    hmacSignature:
      type: apiKey
      in: header
      name: X-AL-Signature
      description: 'sha256=<hex HMAC-SHA256(secret, "{X-AL-Timestamp}.{raw body}")>'
    hmacTimestamp:
      type: apiKey
      in: header
      name: X-AL-Timestamp
      description: Unix time in seconds; must be within 5 minutes.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: INVALID_SIGNATURE }
        message: { type: string }
        details: {}

    Envelope:
      type: object
      required: [eventId, type, data]
      properties:
        eventId: { type: string, maxLength: 200, description: Unique per event; used for deduplication. }
        type: { type: string }
        occurredAt: { type: string, format: date-time }

    Version:
      type: integer
      minimum: 0
      description: Only ever increases for the same record.

    Uom:
      type: string
      maxLength: 20
      examples: [pc, m, roll, box, sqm]

    # ── POS → Website ──

    ProductUpsert:
      type: object
      required: [sku, name, baseUom, active, version]
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 300 }
        barcode: { type: [string, 'null'], maxLength: 64 }
        groupCode:
          type: [string, 'null']
          maxLength: 64
          description: Product family. SKUs with the same groupCode appear as options on one product page (e.g. all sizes of a pipe).
        groupName: { type: [string, 'null'], maxLength: 300, description: Name of the family, used for the product page title. }
        baseUom: { $ref: '#/components/schemas/Uom' }
        weightGrams: { type: integer, minimum: 0, default: 0, description: Per base unit; used for courier fees and limits. }
        vatClass: { type: string, enum: [STANDARD_5, ZERO, EXEMPT], default: STANDARD_5 }
        active: { type: boolean, description: false hides the SKU from the website. }
        options:
          type: [object, 'null']
          additionalProperties: { type: string }
          description: Option values that tell family members apart, e.g. {"size":"20 mm","colour":"White"}.
          example: { size: 20 mm }
        uomConversions:
          type: array
          default: []
          description: Other units the SKU is sold in, as a multiple of the base unit.
          items:
            type: object
            required: [uom, factor]
            properties:
              uom: { $ref: '#/components/schemas/Uom' }
              factor: { type: number, exclusiveMinimum: 0, example: 100 }
          example: [{ uom: roll, factor: 100 }]
        version: { $ref: '#/components/schemas/Version' }
      description: |
        New SKUs create a draft (unpublished) product on the website; staff add
        photos and descriptions and publish it.

    ProductUpsertEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type: { const: product.upsert }
            data: { $ref: '#/components/schemas/ProductUpsert' }

    StockItem:
      type: object
      required: [sku, branchCode, quantity, version]
      properties:
        sku: { type: string }
        branchCode: { type: string, description: Must match a branch code set up in the website admin. }
        quantity: { type: number, description: On-hand quantity in the base unit. The website holds back a safety buffer itself. }
        version: { $ref: '#/components/schemas/Version' }

    StockUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type: { const: stock.updated }
            data:
              oneOf:
                - $ref: '#/components/schemas/StockItem'
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      minItems: 1
                      maxItems: 5000
                      items: { $ref: '#/components/schemas/StockItem' }

    PriceList:
      type: object
      required: [code, name, type, version]
      properties:
        code: { type: string, maxLength: 64, example: RETAIL }
        name: { type: string }
        type:
          type: string
          enum: [RETAIL, TRADE, PROMO]
          description: RETAIL and PROMO apply to everyone; TRADE applies only to customers it is assigned to.
        channel: { type: string, enum: [ALL, POS, ONLINE], default: ALL, description: POS-only lists are ignored by the website. }
        priority: { type: integer, default: 0, description: Breaks ties when two lists give the same price. }
        validFrom: { type: [string, 'null'], format: date-time }
        validTo: { type: [string, 'null'], format: date-time }
        active: { type: boolean, default: true }
        version: { $ref: '#/components/schemas/Version' }

    PriceRow:
      type: object
      required: [sku, uom, netPriceFils]
      properties:
        sku: { type: string }
        uom: { $ref: '#/components/schemas/Uom' }
        minQty: { type: number, exclusiveMinimum: 0, default: 1, description: Quantity break in this row's unit. }
        netPriceFils: { type: integer, minimum: 0, description: Unit price, VAT-exclusive. }

    PriceListUpsertedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type: { const: price_list.upserted }
            data: { $ref: '#/components/schemas/PriceList' }

    PriceItemsChangedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type: { const: price_items.changed }
            data:
              type: object
              required: [priceListCode, version]
              description: Only the changed rows. The list must exist first (send price_list.upserted before).
              properties:
                priceListCode: { type: string }
                version: { $ref: '#/components/schemas/Version' }
                upsert: { type: array, items: { $ref: '#/components/schemas/PriceRow' } }
                delete:
                  type: array
                  items:
                    type: object
                    required: [sku, uom]
                    properties:
                      sku: { type: string }
                      uom: { $ref: '#/components/schemas/Uom' }
                      minQty: { type: number, default: 1 }

    CustomerPriceListAssignedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type: { const: customer_price_list.assigned }
            data:
              type: object
              required: [priceListCodes]
              description: Replaces the customer's assigned lists. Assigning a TRADE list approves the trade account.
              properties:
                customerEmail: { type: [string, 'null'], format: email }
                posCustomerCode: { type: [string, 'null'] }
                priceListCodes: { type: array, maxItems: 20, items: { type: string } }

    PosOrderStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type: { const: order.status_changed }
            data:
              type: object
              required: [orderNumber, status]
              description: Optional. Lets counter staff progress online orders from the POS.
              properties:
                orderNumber: { type: string, example: AL-000123 }
                status: { type: string, enum: [CONFIRMED, PACKED, SHIPPED, READY_FOR_PICKUP, DELIVERED, COLLECTED, CANCELLED] }
                note: { type: [string, 'null'] }
                trackingNumber: { type: [string, 'null'] }
                trackingUrl: { type: [string, 'null'], format: uri }

    Snapshot:
      type: object
      required: [products, stock, priceLists]
      properties:
        products: { type: array, items: { $ref: '#/components/schemas/ProductUpsert' } }
        stock: { type: array, items: { $ref: '#/components/schemas/StockItem' } }
        priceLists:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PriceList'
              - type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PriceRow' } }

    # ── Website → POS ──

    OutboundEnvelope:
      type: object
      required: [eventId, type, occurredAt, data]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string }
        occurredAt: { type: string, format: date-time }

    OrderLine:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        uom: { $ref: '#/components/schemas/Uom' }
        quantity: { type: number }
        unitNetPriceFils: { type: integer, description: Price charged, VAT-exclusive. Record the sale at this price. }
        priceListId: { type: [string, 'null'] }
        priceListCode: { type: [string, 'null'] }
        priceVersion: { type: [integer, 'null'] }
        vatRateBps: { type: integer, description: 500 = 5% }
        lineNetFils: { type: integer }
        lineVatFils: { type: integer, description: VAT after this line's share of the order discount. }

    OrderCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/OutboundEnvelope'
        - type: object
          properties:
            type: { const: order.created }
            data:
              type: object
              description: Sent once the order is placed (paid online, or confirmed for cash on delivery). Deduct stock.
              properties:
                orderNumber: { type: string, example: AL-000123 }
                invoiceNumber: { type: [string, 'null'], example: INV-2026-000123 }
                placedAt: { type: string, format: date-time }
                status: { type: string }
                customer:
                  type: object
                  properties:
                    email: { type: string }
                    phone: { type: string }
                    fullName: { type: string }
                    companyName: { type: [string, 'null'] }
                    trn: { type: [string, 'null'] }
                    posCustomerCode: { type: [string, 'null'] }
                deliveryMethod: { type: string, enum: [COURIER, PICKUP] }
                pickupBranchCode: { type: [string, 'null'] }
                pickupSlot:
                  type: [object, 'null']
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: [string, 'null'], format: date-time }
                shippingAddress: { type: [object, 'null'] }
                payment:
                  type: object
                  properties:
                    method: { type: string, enum: [CARD, APPLE_PAY, GOOGLE_PAY, COD, TABBY, TAMARA] }
                    status: { type: string, enum: [PENDING, AUTHORIZED, PAID, FAILED, REFUNDED, PARTIALLY_REFUNDED] }
                    amountFils: { type: integer }
                lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
                discount:
                  type: [object, 'null']
                  properties:
                    code: { type: [string, 'null'] }
                    netFils: { type: integer }
                shippingNetFils: { type: integer }
                vatFils: { type: integer }
                totalFils: { type: integer, description: VAT-inclusive grand total. }

    OrderStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/OutboundEnvelope'
        - type: object
          properties:
            type: { const: order.status_changed }
            data:
              type: object
              properties:
                orderNumber: { type: string }
                status: { type: string }
                note: { type: [string, 'null'] }
                trackingNumber: { type: [string, 'null'] }

    OrderCancelledEvent:
      allOf:
        - $ref: '#/components/schemas/OutboundEnvelope'
        - type: object
          properties:
            type: { const: order.cancelled }
            data:
              type: object
              description: Return the order's stock.
              properties:
                orderNumber: { type: string }
                status: { const: CANCELLED }
                note: { type: [string, 'null'] }

    RefundCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/OutboundEnvelope'
        - type: object
          properties:
            type: { const: refund.created }
            data:
              type: object
              properties:
                orderNumber: { type: string }
                amountFils: { type: integer }
                provider: { type: string }

    TradeRequestedEvent:
      allOf:
        - $ref: '#/components/schemas/OutboundEnvelope'
        - type: object
          properties:
            type: { const: customer.trade_requested }
            data:
              type: object
              description: A customer applied for a trade account. Assign a TRADE price list with customer_price_list.assigned.
              properties:
                email: { type: string }
                name: { type: string }
                phone: { type: [string, 'null'] }
                companyName: { type: string }
                trn: { type: string }
                message: { type: [string, 'null'] }
