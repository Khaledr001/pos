# Local services for development:   docker compose up -d postgres redis
# Full stack (production-like):      docker compose --profile app up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: allahiq
      POSTGRES_PASSWORD: allahiq
      POSTGRES_DB: al_lahiq_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allahiq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  api:
    profiles: [app]
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://allahiq:allahiq@postgres:5432/al_lahiq_dev
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://web:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["4000:4000"]
    volumes: [uploads:/app/backend/uploads]

  web:
    profiles: [app]
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      API_ORIGIN: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me-revalidate-secret}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
  uploads:
