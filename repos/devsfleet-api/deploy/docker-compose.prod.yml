# =============================================================================
# Production — single VPS, split-ready
#
#   cd deploy && cp .env.prod.example .env && docker compose -f docker-compose.prod.yml up -d
#
# Everything runs on one host today. Each service is a separate container with
# its own image, its own env, and no filesystem coupling to the others, so
# moving one to its own box later means deleting its block here and pointing a
# URL at the new host — no application code changes.
#
# The split is already drawn where it matters:
#
#   `edge`     public. Caddy, admin, api.
#   `internal` NOT public. Postgres, Redis, MinIO. Only the API is on both, so
#              nothing but the API can reach the database — including the admin
#              panel, which has no credentials for it in the first place.
# =============================================================================

name: devsfleet

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — TLS termination and routing.
  # Caddy over nginx here purely because it obtains and renews Let's Encrypt
  # certificates with no cron job and no extra config.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: devsfleet-caddy
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_ADMIN: ${DOMAIN_ADMIN:?set DOMAIN_ADMIN}
      DOMAIN_API: ${DOMAIN_API:?set DOMAIN_API}
      DOMAIN_CDN: ${DOMAIN_CDN:-}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    networks: [edge]
    depends_on: [api, admin]

  # ---------------------------------------------------------------------------
  # API — the only service that talks to Postgres
  # ---------------------------------------------------------------------------
  api:
    image: ${REGISTRY:-devsfleet}/api:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: devsfleet-api
    <<: [*restart, *logging]
    env_file: [./api.env]
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgres://devsfleet_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/devsfleet
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # No published ports. Only Caddy reaches it, over the `edge` network.

  # ---------------------------------------------------------------------------
  # Admin panel — HTTP client of the API, nothing more.
  # Deliberately NOT on `internal`: it must not be able to reach the database
  # even by accident.
  # ---------------------------------------------------------------------------
  admin:
    image: ${REGISTRY:-devsfleet}/admin:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        # Build-time, not runtime — Next inlines NEXT_PUBLIC_* into the client
        # bundle. Changing this needs a rebuild.
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API}/api/v1
    container_name: devsfleet-admin
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: 3000
    networks: [edge]

  # ---------------------------------------------------------------------------
  # Migrations — one-shot, profile-gated so it never runs on a plain `up`.
  #   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
  # Uses the API image, which carries migrations/ and sql/.
  # ---------------------------------------------------------------------------
  migrate:
    image: ${REGISTRY:-devsfleet}/api:${TAG:-latest}
    profiles: [migrate]
    <<: *logging
    restart: "no"
    environment:
      NODE_ENV: production
      # The MIGRATOR role — owns the schema and bypasses RLS. Correct here and
      # nowhere else.
      DATABASE_URL_MIGRATOR: postgres://devsfleet_migrator:${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD}@postgres:5432/devsfleet
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    # Compiled entrypoint — the API image has no `tsx`. It reads
    # DATABASE_URL_MIGRATOR from the environment only, never from a file.
    command: ["node", "node_modules/@devsfleet/db/dist/bin/migrate.js"]

  # ---------------------------------------------------------------------------
  # Data services — internal network only, no published ports.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: devsfleet-postgres
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: devsfleet_migrator
      POSTGRES_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD}
      POSTGRES_DB: devsfleet
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsfleet_migrator -d devsfleet"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    command:
      - postgres
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"

  redis:
    image: redis:8-alpine
    container_name: devsfleet-redis
    <<: [*restart, *logging]
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:latest
    container_name: devsfleet-minio
    <<: [*restart, *logging]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    # `edge` as well, so Caddy can serve product images from DOMAIN_CDN.
    networks: [edge, internal]

  # ---------------------------------------------------------------------------
  # Nightly Postgres dump. Keeps 14 days.
  # Restore is rehearsed in docs/DEPLOYMENT.md — an untested backup is a guess.
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:18-alpine
    container_name: devsfleet-backup
    <<: [*restart, *logging]
    environment:
      PGPASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD}
    volumes:
      - ./backups:/backups
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          STAMP=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h postgres -U devsfleet_migrator -d devsfleet -Fc \
            -f /backups/devsfleet-$$STAMP.dump \
            && echo "backup ok: devsfleet-$$STAMP.dump" \
            || echo "BACKUP FAILED at $$STAMP"
          find /backups -name '*.dump' -mtime +14 -delete
          sleep 86400
        done

networks:
  # Public-facing. Caddy, admin, api.
  edge:
    driver: bridge
  # No route to the internet and no published ports. Data services only.
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
